name: Test

on:
  push:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '25.8.1'

      - name: Install dependencies
        run: npm ci

      - name: Run Biome
        run: npx biome check js/ tests/

      - name: Run Oxlint
        run: npx oxlint js/ tests/

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.3.0
        with:
          node-version: '25.8.1'

      - name: Install dependencies
        run: npm ci

      - name: Run JS tests
        run: npm run test:js

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run Swift tests
        run: npm run test:swift
